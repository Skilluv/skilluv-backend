global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: skilluv-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - api.skill-uv.com:443
    scheme: https
    # If /metrics is gated by METRICS_TOKEN, uncomment:
    # authorization:
    #   type: Bearer
    #   credentials_file: /run/secrets/skilluv_metrics_token
