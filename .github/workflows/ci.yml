name: CI

on:
  push:
    branches: [master]
    # Skip CI entirely when only docs / config / readme change on master.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"

# Cancel any in-progress run on the same branch when a new commit arrives.
# Saves ~30 min of GHA time per force-push during PR iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # NB : SCCACHE_GHA_ENABLED + RUSTC_WRAPPER are scoped to the `check` job
  # only (see its own env block). At workflow level, RUSTC_WRAPPER=sccache
  # crashes jobs that don't install the sccache binary (audit, secrets).

# Least-privilege default. Jobs that need more (publish → packages:write,
# check → actions:write for sccache) override in their own `permissions:` block.
permissions:
  contents: read

jobs:
  # ─── Static gates ──────────────────────────────────────────────────
  # Cheap, fail-fast : lint, secret leaks, known CVEs. All three run in
  # parallel and gate the heavier test job.

  check:
    name: Build & Lint
    runs-on: ubuntu-latest
    # 25 min budget : cold cache full cargo build (release) + clippy + fmt
    # is 12-18 min. sccache accelerates subsequent runs but the FIRST run
    # after a Cargo.lock change is cold.
    timeout-minutes: 25
    permissions:
      contents: read
      # sccache-action needs the GHA cache API (mozilla-actions/sccache-action).
      actions: write
    env:
      # sccache is installed in this job only — RUSTC_WRAPPER is job-scoped
      # so cargo commands in other jobs don't try to invoke a non-existent binary.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: clippy, rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Cache cargo registry & git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          # `target/` deliberately EXCLUDED : it grew to ~9 GB after we
          # added sqlx offline data + utoipa spec generation, and the
          # save/restore round-trip alone was blowing the job timeout
          # (7 min download + 4+ min upload out of a 25 min budget).
          # sccache handles compile-unit caching for us via the GHA
          # cache API — no need to also snapshot target/. Registry + git
          # dirs stay cached to avoid re-downloading crates.io deps.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --release

      - name: Clippy lint
        run: cargo clippy -- -D warnings -A dead_code -A unused_imports

      - name: Install cargo-machete
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2
        with:
          tool: cargo-machete

      - name: Detect unused dependencies
        # cargo-machete reports crates declared in Cargo.toml but never used
        # in the source. Prevents dep-graph bloat. `--with-metadata` cross-
        # references features flags to reduce false positives.
        run: cargo machete --with-metadata

  audit:
    name: Cargo Audit + Deny (CVE, licenses, banned crates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: Install cargo-deny
        # cargo-deny supersets cargo-audit : same RustSec advisory DB PLUS
        # license compliance PLUS banned/duplicate crate detection. Config
        # in `deny.toml` at repo root.
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2
        with:
          tool: cargo-deny
      - name: Run cargo deny
        run: cargo deny check advisories licenses bans sources

  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # Full history so gitleaks scans every commit, not just HEAD.
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for GitHub Organizations
      # (breaking change, cf. https://github.com/gitleaks/gitleaks-action#-announcement).
      # Fallback to the CLI download — free, same detection, no license needed.
      # We keep .gitleaks.toml as the allowlist config (auto-picked from repo root).
      - name: Install gitleaks CLI
        run: |
          VERSION=8.21.2
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  test:
    # Matrix sharding — nextest partitions tests by hash across N runners.
    # Each shard is a fresh job with its own Postgres/Redis/MinIO, so there
    # are no shared-state collisions and wall time drops from ~30 min
    # sequential to ~8 min for 4 shards.
    #
    # Trello BE-P2-CI-CONTRACT-EXPAND — extended from 2 to 4 shards. GHA
    # storage quota is now healthy (post-Aug reset), and per-PR wall time
    # matters more than total compute for developer flow (halved from
    # ~15 min to ~8 min). Total compute rises from 2× ≈ 30 min to 4× ≈
    # 40 min ; acceptable trade-off.
    #
    # fail-fast: false ensures we see all shard failures at once instead of
    # the first one aborting the rest — critical for debugging.
    name: Integration Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [check, audit, secrets]
    # Skip drafts to save quota — devs can mark PR ready when they want CI.
    if: github.event.pull_request.draft == false
    # 25 min budget : cold cache = ~6-7 min compile (dev profile, hyper-timeout
    # + prost + tonic-prost + skilluv-backend) + ~8 min test run. All 4 shards
    # run in parallel with independent sccache caches, so the first PR after a
    # Cargo.lock bump is uniformly cold. Shards 1&2 hit the 15 min ceiling on
    # #40's cold run; shards 3&4 finished at ~13-14 min. 25 = check job budget.
    timeout-minutes: 25
    permissions:
      contents: read
      # sccache-action needs the GHA cache API (mozilla-actions/sccache-action).
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: skilluv
          POSTGRES_PASSWORD: skilluv_secret
          POSTGRES_DB: skilluv
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U skilluv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Mailpit — SMTP dev catcher. Le test harness force SMTP_HOST=localhost:1025
      # (voir tests/common/mod.rs::spawn). Sans ce service, /api/auth/register et
      # /api/enterprise/register renvoient 500 sur echec SMTP.
      mailpit:
        image: axllent/mailpit:v1.20.7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MinIO n'est PAS declare comme service GHA : les services ne supportent
      # pas de champ `command`, et l'image minio/minio requiert `server /data`
      # en argument (sans ca, elle affiche l'usage et sort). On la lance en step
      # (voir "Start MinIO container" plus bas).

    env:
      # sccache installed via sccache-action below (matches check job pattern).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      DATABASE_URL: postgres://skilluv:skilluv_secret@localhost:5433/skilluv
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      BASE_URL: http://localhost:3001
      JUDGE0_URL: http://localhost:2358
      MINIO_ENDPOINT: http://localhost:9004
      MINIO_ACCESS_KEY: skilluv
      MINIO_SECRET_KEY: skilluv_secret
      MINIO_BUCKET: avatars
      # Backend tracing is invisible in tests without a subscriber (see
      # tests/common/mod.rs::init_test_tracing). Verbose here to surface any
      # 500 root causes in the CI logs.
      RUST_LOG: info,skilluv_backend=debug,sqlx=warn

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Start MinIO container
        run: |
          docker run -d --name minio \
            -p 9004:9000 \
            -e MINIO_ROOT_USER=skilluv \
            -e MINIO_ROOT_PASSWORD=skilluv_secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data

      - name: Wait for MinIO to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9004/minio/health/live > /dev/null 2>&1; then
              echo "MinIO ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become ready after 30s"
          docker logs minio
          exit 1

      # GeoNames data files are gitignored (~31MB total) but required by
      # `GeoService::load` which several integration tests instantiate. Download
      # them once here, cache across runs.
      - name: Cache GeoNames data
        id: cache-geonames
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: data
          key: geonames-cities1000-countryinfo-v1

      - name: Download GeoNames data
        if: steps.cache-geonames.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          curl -fsSL https://download.geonames.org/export/dump/cities1000.zip -o /tmp/cities1000.zip
          unzip -o /tmp/cities1000.zip -d data
          curl -fsSL https://download.geonames.org/export/dump/countryInfo.txt -o data/countryInfo.txt
          ls -lh data/

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad  # v2
        with:
          tool: cargo-nextest

      - name: Run integration tests (shard ${{ matrix.shard }}/4)
        # `--partition count:N/4` — nextest hash-partitions ~540 tests
        # across 4 shards. `--test-threads=1` kept within each shard
        # because a few tests still touch shared Postgres server-side
        # state (RLS GUC, metrics counters).
        run: |
          cargo nextest run \
            --test-threads=1 \
            --partition count:${{ matrix.shard }}/4 \
            --failure-output=immediate \
            --success-output=never

      - name: Run doctests (shard 1 only)
        # Doctests are cheap and not sharded ; run them once on shard 1 to
        # avoid duplicating the same run across 4 jobs.
        if: matrix.shard == 1
        run: cargo test --doc

      - name: Cleanup MinIO container
        if: always()
        run: docker rm -f minio || true

  integration-tests:
    # Umbrella status check for the sharded `test` matrix. Branch
    # protection requires a check literally named "Integration Tests";
    # each shard reports as "Integration Tests (shard N/4)", so this
    # aggregator fans them in under the required name. Runs even on
    # shard failure so protection sees a red "Integration Tests"
    # instead of a pending one.
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: Fail if any shard failed or was cancelled
        if: needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1
      - name: All shards passed
        run: echo "All 4 test shards succeeded."

  publish:
    # Build + push a Docker image to GHCR on every master push so downstream
    # consumers (skilluv-admin CI e2e job) can pull a ready-to-run backend
    # without rebuilding Rust in each PR. Master is protected + PR-merge only,
    # so `:master` is always a green build. `:master-<sha>` gives traceability.
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/skilluv/skilluv-backend:master
            ghcr.io/skilluv/skilluv-backend:master-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        # Skips silently if the required secrets are unset — lets the workflow
        # keep working in forks / rewinds without hard-failing on missing config.
        # Coolify's /api/v1/deploy endpoint requires a Bearer token; the UUID
        # in the URL only identifies which app to redeploy.
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_WEBHOOK_URL or COOLIFY_TOKEN unset — skipping deploy trigger."
            exit 0
          fi
          # -w prints HTTP status + response body on both success and failure so
          # any future Coolify API mismatch is diagnosable from CI logs directly,
          # instead of guessing across multiple PRs (cf. #52/#53/#54 iteration).
          response=$(curl --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "$COOLIFY_WEBHOOK_URL")
          echo "$response"
          status=$(echo "$response" | grep -oE "HTTP_STATUS:[0-9]+" | cut -d: -f2)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify webhook returned HTTP $status"
            exit 1
          fi

      - name: Wait for deploy + smoke test
        # SKI-28 (Hygiène pré-prod HYG-01) — after Coolify triggers a
        # redeploy, wait a bit for the new container to boot then hit
        # scripts/smoke.sh against the live URL. Fails the workflow if
        # the new deploy is silently broken.
        # Skips when SKILLUV_SMOKE_URL is unset (e.g. fork PRs).
        env:
          SKILLUV_SMOKE_URL: ${{ secrets.SKILLUV_SMOKE_URL }}
        if: env.SKILLUV_SMOKE_URL != ''
        run: |
          echo "Waiting 60s for Coolify to swap the image..."
          sleep 60
          chmod +x scripts/smoke.sh
          bash scripts/smoke.sh "$SKILLUV_SMOKE_URL"

      - name: Notify Discord on failure
        # SKI-32 (Hygiène pré-prod HYG-05) — post the failure to Discord
        # #ops-alerts channel via webhook. Fires on any prior step failing
        # in this job (Docker publish, Coolify webhook, or smoke test).
        # Skips silently when DISCORD_ALERT_WEBHOOK_URL is unset.
        if: failure() && env.DISCORD_ALERT_WEBHOOK_URL != ''
        env:
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          # Build JSON payload with jq to avoid shell interpolation of
          # attacker-controllable context values (github.actor). zizmor E2.
          payload=$(jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            '{content: ("**CI publish/deploy failed on master** — commit `" + $sha + "` by " + $actor + "\n" + $url)}')
          curl --silent --show-error --max-time 15 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_ALERT_WEBHOOK_URL" || echo "Discord notify failed — not blocking"
