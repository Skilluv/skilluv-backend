name: Nightly DAST (ZAP + nuclei)

# DA-02 + CI-04 — dynamic scan against an ephemeral full stack.
#
# Builds nothing: pulls the already-published backend image
# (ghcr.io/skilluv/skilluv-backend:master), stands it up next to GitHub-service
# dependencies (the same postgres/redis/mailpit setup ci.yml's integration job
# uses — health-checked, no volume, so the postgres:18 data layout is a
# non-issue), and points OWASP ZAP and nuclei at it. Advisory — findings are
# triaged, not gated. Everything is torn down at the end.

on:
  schedule:
    - cron: "53 3 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dast-nightly
  cancel-in-progress: true

env:
  BACKEND_PORT: "3000"

jobs:
  dast:
    name: ZAP + nuclei on an ephemeral stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read

    # Health-checked service containers (no volume mount → postgres:18 starts
    # clean). MinIO is NOT a service — the image needs a `server /data` command,
    # which GHA services cannot pass — so it is a docker-run step below.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: skilluv
          POSTGRES_PASSWORD: skilluv_secret
          POSTGRES_DB: skilluv
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U skilluv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.20.7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Start MinIO container
        run: |
          docker run -d --name minio -p 9004:9000 \
            -e MINIO_ROOT_USER=skilluv \
            -e MINIO_ROOT_PASSWORD=skilluv_secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the backend against the stack
        # Host network so the container reaches the service ports on localhost
        # (Postgres 5433, Redis 6379, MinIO 9004). The backend runs its own
        # migrations on startup; the services are health-checked before steps run.
        run: |
          docker run -d --name skilluv-backend --network host \
            -e DATABASE_URL="postgres://skilluv:skilluv_secret@localhost:5433/skilluv" \
            -e REDIS_URL="redis://localhost:6379" \
            -e JWT_SECRET="dast-test-secret" \
            -e PORT="${BACKEND_PORT}" \
            -e BASE_URL="http://localhost:${BACKEND_PORT}" \
            -e MINIO_ENDPOINT="http://localhost:9004" \
            -e MINIO_ACCESS_KEY="skilluv" \
            -e MINIO_SECRET_KEY="skilluv_secret" \
            -e MINIO_BUCKET="avatars" \
            ghcr.io/skilluv/skilluv-backend:master

      - name: Wait for the backend to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "http://localhost:${BACKEND_PORT}/api/health" >/dev/null 2>&1; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"; docker logs skilluv-backend || true; exit 1

      - name: OWASP ZAP baseline scan
        continue-on-error: true
        run: |
          docker run --network host -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://localhost:${BACKEND_PORT}/api" \
            -r zap-report.html -I

      - name: nuclei scan
        continue-on-error: true
        run: |
          docker run --network host projectdiscovery/nuclei:latest \
            -u "http://localhost:${BACKEND_PORT}" \
            -severity medium,high,critical -o /dev/stdout || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: zap-report
          path: zap-report.html
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker rm -f skilluv-backend minio || true
