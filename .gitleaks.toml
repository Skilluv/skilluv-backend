# Gitleaks configuration — extends the default ruleset with an allowlist for
# our known false positives. Anything sensitive (real API keys, tokens, JWT
# secrets) will still be caught.

[extend]
useDefault = true

[allowlist]
description = "Known-safe placeholders and test fixtures"

# Files that are ONLY placeholders / fixtures — never real secrets.
paths = [
    '''(?i)\.env\.example''',
    '''(?i)tests/common/mod\.rs''',
    '''(?i)tests/.*_test\.rs''',
    '''(?i)docs/.*''',
    '''(?i)migrations/.*''',
]

# Specific patterns that look like secrets but are documented test values.
regexes = [
    # Test JWT secret used across the test harness.
    '''test_secret_min_32_chars_long_enough''',
    # Dev-mode default MinIO credentials (safe : local docker only, doc'd).
    '''skilluv_secret''',
    # RustSec ignore patterns
    '''RUSTSEC-\d{4}-\d{4}''',
    # Placeholder patterns explicitly written as fake in docs / .env.example.
    '''change-this-to-a-secure-random-string''',
    '''xxxxxxxxxxxxxxxx''',
    # VAPID public key is *supposed* to be public (RFC 8292). We do not scan
    # for private keys specifically ; those are caught by the ed25519 rule.
    '''VAPID_PUBLIC_KEY=[A-Za-z0-9_-]+''',
]

# Individual commits to skip — use only for legacy leaks that have been rotated
# and cannot practically be scrubbed from history. Empty for now.
commits = []

# ── SE-01 — custom rules for OUR provider shapes ────────────────────────────
# The default ruleset catches generic/AWS/high-entropy secrets. These add the
# specific forms this project uses, so a real one is caught by shape even when
# entropy alone would not flag it. Placeholders in .env.example / tests / docs
# are covered by the [allowlist] above.

[[rules]]
id = "skilluv-brevo-api-key"
description = "Brevo (Sendinblue) API key"
regex = '''xkeysib-[0-9a-f]{64}-[0-9A-Za-z]{16}'''
keywords = ["xkeysib"]

[[rules]]
id = "skilluv-stripe-secret-key"
description = "Stripe secret/live key"
regex = '''sk_(live|test)_[0-9A-Za-z]{24,}'''
keywords = ["sk_live", "sk_test"]

[[rules]]
id = "skilluv-discord-bot-token"
description = "Discord bot token"
regex = '''[MNO][A-Za-z0-9_-]{23}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,}'''
keywords = ["discord", "Bot "]

[[rules]]
id = "skilluv-research-token"
description = "Skilluv security research token (srt_ prefix, 32 bytes hex)"
regex = '''srt_[0-9a-f]{64}'''
keywords = ["srt_"]

[[rules]]
id = "skilluv-jwt-secret-inline"
description = "A long JWT_SECRET value assigned inline instead of read from env"
regex = '''(?i)JWT_SECRET\s*[=:]\s*['"]?[A-Za-z0-9+/=_-]{32,}['"]?'''
keywords = ["JWT_SECRET"]

[[rules]]
id = "skilluv-postgres-url-with-password"
description = "A postgres URL carrying a non-placeholder password"
regex = '''postgres(ql)?://[^:@\s]+:(?!skilluv_secret)[^@\s]{8,}@'''
keywords = ["postgres://", "postgresql://"]
