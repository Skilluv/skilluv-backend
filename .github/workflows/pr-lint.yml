name: PR title lint

# Enforces conventional-commit style on PR titles so release-please can
# parse them and generate the CHANGELOG. Blocks merge with a clear message
# on how to fix.
#
# Allowed types below match commitlint's default + our internal usage.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
            security
          # Enforce lower-case scope + description for consistency.
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject "{subject}" must start with a lower-case letter.
            Examples :
              feat(auth): add passkey support
              fix(billing): correct EUR/USD conversion
              chore(deps): bump reqwest to 0.13
