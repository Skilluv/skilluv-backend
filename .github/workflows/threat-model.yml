name: Threat-model gate

# SA-03 — the threat model as a grep gate (scripts/check-threat-model.sh).
# Compiles nothing, runs in a second, and is transparent enough to read in
# full. Separate from ci.yml with its own job name, so it never touches the
# required-check graph; make it required in branch protection if you want the
# two hard checks (dynamic SQL, console prints) to block a merge.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: threat-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  threat-model:
    name: Threat-model gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Run the threat-model checks
        run: bash scripts/check-threat-model.sh
      - name: Admin authorization guards (AZ-01 static)
        run: python3 scripts/check-admin-guards.py
      - name: No credential-shaped config defaults (SE-01)
        run: bash scripts/check-config-secrets.sh
      - name: .env.example documents every env var (SE-03)
        run: bash scripts/check-env-example.sh
