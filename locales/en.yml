_version: 1

# Authentication errors
auth:
  unauthorized: "Unauthorized"
  invalid_credentials: "Invalid email/username or password"
  forbidden: "Forbidden"
  email_not_verified: "Please verify your email before continuing"
  account_banned: "This account has been banned"
  totp_required: "TOTP code is required"
  totp_invalid: "Invalid TOTP code"
  email_2fa_required: "Email 2FA code required"
  email_2fa_invalid: "Invalid 2FA code"

# Validation errors
validation:
  email_invalid: "Invalid email address"
  username_invalid: "Username must be 3-30 characters, alphanumeric or _-"
  password_too_weak: "Password must be at least 8 characters with a digit and a letter"
  required_field: "Required field is missing"
  too_long: "Value exceeds the maximum length"
  account_exists: "An account with this email or username already exists"

# Resource errors
resources:
  not_found: "Not found"
  challenge_not_found: "Challenge not found"
  user_not_found: "User not found"
  challenge_prerequisite_not_met: "You don't have enough fragments to start this challenge"

# Rate limiting
rate_limit:
  exceeded: "Too many requests. Please try again later."

# Email templates (subjects only, body in HTML templates)
emails:
  verify_subject: "Skilluv — Verify your email"
  password_reset_subject: "Skilluv — Reset your password"
  data_export_subject: "Skilluv — Your data archive is ready"
  digest_subject: "Your Skilluv week — {challenges_completed} challenges / {fragments_earned} fragments"

# System messages
system:
  internal_error: "Something went wrong. Please try again."
  service_unavailable: "Service temporarily unavailable"
  insufficient_credits: "Insufficient credits to perform this action"

# ─── Email frame ─────────────────────────────────────────────────
email:
  greeting: "Hello {name},"
  footer_note: "You are receiving this because you have a Skilluv account."
  unsubscribe: "Manage my notifications"

# ─── Notifications ───────────────────────────────────────────────
notification:
  payout:
    sent:
      title: "Your payout is on its way"
      body: "{amount} was sent to {destination}. Allow a few minutes to a few days depending on the channel."
    failed:
      title: "Your payout could not be sent"
      body: "Sending {amount} failed. The money is still in your balance and you can try again."
  payment:
    received:
      title: "Payment received"
      body: "{amount} was paid for {subject}."
    refunded:
      title: "Payment refunded"
      body: "{amount} was refunded for {subject}."
  funds:
    released:
      title: "Your money is available"
      body: "{amount} has just been released. You can withdraw it whenever you like."
    disputed:
      title: "A payment is disputed"
      body: "{amount} is frozen while we look into the complaint about {subject}."
  security:
    new_login:
      title: "New sign-in to your account"
      body: "Someone signed in from {location}. If this was not you, change your password."
    password_changed:
      title: "Your password changed"
      body: "If you did not make this change, contact us immediately."
  account:
    capability_granted:
      title: "New capability unlocked"
      body: "You can now {capability} on Skilluv."
  challenge:
    reviewed:
      title: "Your contribution was reviewed"
      body: "{reviewer} left feedback on {subject}."
    validated:
      title: "Contribution validated"
      body: "{subject} is validated. The matching attestation is available."
  attestation:
    issued:
      title: "New attestation"
      body: "Your attestation for {subject} is ready, and publicly verifiable."
  rank:
    promoted:
      title: "You are now {rank}"
      body: "Your work on the platform earned you the rank of {rank}."
  badge:
    earned:
      title: "Badge earned: {badge}"
      body: "It is now visible on your public profile."
  mentorship:
    booked:
      title: "Session booked"
      body: "{other} booked a session on {date}."
    reminder:
      title: "Session tomorrow"
      body: "Your session with {other} is on {date}."
    cancelled:
      title: "Session cancelled"
      body: "The session on {date} with {other} was cancelled."
  social:
    mention:
      title: "{author} mentioned you"
      body: "{excerpt}"
    reply:
      title: "{author} replied to you"
      body: "{excerpt}"
  guild:
    invitation:
      title: "Invitation to join {guild}"
      body: "{inviter} invites you to join the {guild} guild."
    application:
      title: "New application"
      body: "{applicant} wants to join {guild}."
  enterprise:
    credits_low:
      title: "Credits running low"
      body: "You have {credits} credits left. Top up to keep your searches running."
    invoice_ready:
      title: "Invoice available"
      body: "Your invoice {reference} is ready to download."
    talent_replied:
      title: "{talent} replied"
      body: "A reply to your outreach."
  admin:
    review_queued:
      title: "{count} item(s) awaiting review"
      body: "The moderation queue needs attention."
    fraud_flagged:
      title: "Fraud flag raised"
      body: "{subject} was flagged automatically and awaits a decision."
    payout_needs_replay:
      title: "Payout needs replaying"
      body: "{count} payout(s) are owed and did not go through. They were not sent."
    reconciliation_drift:
      title: "Reconciliation drift"
      body: "Internal books and the {provider} statement differ by {amount}."
