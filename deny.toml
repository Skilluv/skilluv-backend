# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Complements cargo-audit :
#   [advisories] — same RustSec CVE DB as cargo-audit (kept for parity)
#   [licenses]   — hard rules on what licenses we accept (compliance)
#   [bans]       — crates we forbid or that must exist only once (duplicate detection)
#   [sources]    — only crates.io + our own git repos, no random registries

[advisories]
version = 2
# Any advisory (RustSec) fails the check unless explicitly allowed below.
ignore = []
# YANKED = crate.io yanked crates. Warn only ; a yanked dep still works but
# should be updated at the next Dependabot cycle.
yanked = "warn"

[licenses]
version = 2
# Allowlist — anything else fails. Keep this tight ; loosen only after a
# license review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",       # weak copyleft, fine to link
    "CC0-1.0",       # public domain equivalent
    "CDLA-Permissive-2.0",
    "OpenSSL",       # rare, needed by aws-lc-sys / ring
]
# Fail on unlicensed or unclear crates rather than silently accepting them.
confidence-threshold = 0.93
# Specific exceptions — case by case, always documented.
exceptions = []

[bans]
# Fail on duplicate versions of the same crate (bloat + potential subtle bugs).
multiple-versions = "warn"
# `deny` = compile error, `warn` = warning. Crates we want to ban outright.
deny = [
    # OpenSSL FFI is a common source of soundness bugs — prefer rustls or
    # aws-lc where possible. Warn today, deny once migration is complete.
    # { name = "openssl", wrappers = ["reqwest"] },
]
# Crates we don't want more than N versions of at once.
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Add our own private git registries here if we ever host any.
allow-git = []
