# Contract-fuzzing configuration.
#
# Picked up automatically by `schemathesis run` from the repository root. The
# workflow (.github/workflows/contract-test.yml) passes `--checks all`; what is
# here narrows that for the operations where a check asks for something the
# API should not do.
#
# Every exclusion needs a written reason. The rule is the same one deny.toml
# follows for advisories: an exception that nobody can explain later becomes an
# exception nobody dares remove.

[generation]
# Do not generate NUL inside strings.
#
# JSON Schema's `string` admits `\0`; a PostgreSQL `text` column does not, at
# all. So the API refuses a request carrying one, with a 400 saying so — which
# is the correct answer and which the generic "schema-compliant input must be
# accepted" check reads as a bug.
#
# Turned off here rather than by disabling that check, because the check is
# worth keeping: it is the one that would notice the API refusing input it
# ought to take. What is wrong is the input, not the expectation.
allow-x00 = false

[[operations]]
include-name = "GET /api/feed/public"

# `positive_data_acceptance` requires that anything matching the schema is
# accepted. `after` is a keyset cursor — a token the server issued — and no
# JSON Schema can say "a value I minted". The fuzzer generates a random string
# matching the pattern, the handler cannot decode it, and 400 is the right
# answer: treating an unreadable cursor as "from the beginning" makes a client
# silently re-read the whole feed and never find out why.
#
# The 400 is documented in the operation's responses, so a caller reading the
# contract knows it exists.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/talents/search"

# Same cursor, same reasoning. Here it matters more: this is a recruiter's
# tool, and a paginating client that silently restarts shows the first page
# again as though it were the third.
[operations.checks.positive_data_acceptance]
enabled = false
