name: Sign published image + attach SBOM

# Runs AFTER the publish workflow (see PR #33) has pushed an image to GHCR.
# Signs the image with cosign (keyless, OIDC-based — no keys to rotate) and
# attaches the CycloneDX SBOM as a signed attestation. Consumers can verify
# both with `cosign verify` against our GitHub Actions identity.
#
# Reference : https://docs.sigstore.dev/cosign/signing/overview/

on:
  workflow_run:
    workflows: ["CI"]   # trigger after the main CI (which contains publish) succeeds on master
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write     # to sign packages in GHCR
  id-token: write     # for keyless signing (Sigstore OIDC)

concurrency:
  group: image-sign-${{ github.ref }}
  cancel-in-progress: false   # never cancel a signing run mid-way

jobs:
  sign:
    name: cosign + SBOM attestation
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Spelled out in lowercase rather than derived from
      # `github.repository_owner`, which is `Skilluv`: Docker rejects an
      # uppercase repository name, so every cosign call failed on a
      # reference the publishing job never produces. This is the exact
      # string the CI publish step pushes to (see ci.yml).
      IMAGE: ghcr.io/skilluv/skilluv-backend
      SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image (keyless)
        # Each digest is resolved into a variable and checked before use.
        # Inlined in the cosign argument, a failed inspect substitutes an
        # empty string and cosign reports a malformed reference
        # (`:master@` with nothing after it) instead of the lookup that
        # actually failed.
        run: |
          for TAG in "master" "master-${SHA}"; do
            DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" \
              --format '{{json .Manifest}}' | jq -r .digest)
            if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
              echo "::error::no digest for ${IMAGE}:${TAG} - is the image published?"
              exit 1
            fi
            cosign sign --yes "${IMAGE}:${TAG}@${DIGEST}"
          done

      - name: Generate SBOM
        run: |
          syft "${IMAGE}:master-${SHA}" -o cyclonedx-json > sbom.cdx.json
          syft "${IMAGE}:master-${SHA}" -o spdx-json      > sbom.spdx.json

      - name: Attach SBOM as signed attestation
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${IMAGE}:master-${SHA}"

      - name: Upload SBOMs as artifact (90d retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-${{ env.SHA }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
          retention-days: 90

      - name: Verification instructions
        env:
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## How to verify this image"
            echo '```'
            echo "cosign verify ${IMAGE}:master-${SHA} \\"
            echo "  --certificate-identity-regexp='https://github.com/${REPO}/.*' \\"
            echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
