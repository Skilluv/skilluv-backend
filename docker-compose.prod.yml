services:
  skilluv-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skilluv-backend
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://skilluv:${POSTGRES_PASSWORD:-skilluv_secret}@postgres:5432/skilluv
      REDIS_URL: redis://redis:6379
      HOST: "0.0.0.0"
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      BASE_URL: ${BASE_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-skilluv}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-skilluv_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-avatars}
      RUST_LOG: ${RUST_LOG:-skilluv_backend=info,tower_http=info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Same reason as the Dockerfile's HEALTHCHECK: migrations and the seed
      # run before the listener binds. Fifteen seconds of grace, then five
      # checks ten seconds apart, marked the container unhealthy about a
      # minute into a boot that legitimately takes longer than that.
      start_period: 300s
    networks:
      - skilluv-net

  postgres:
    image: postgres:18.4-alpine
    container_name: skilluv-postgres
    environment:
      POSTGRES_USER: skilluv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skilluv_secret}
      POSTGRES_DB: skilluv
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    command: ["postgres", "-c", "lc_messages=C", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - skilluv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilluv"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - skilluv-net

  redis:
    image: redis:8.8-alpine
    container_name: skilluv-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - skilluv_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - skilluv-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: skilluv-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-skilluv}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-skilluv_secret}
    command: server /data --console-address ":9001"
    volumes:
      - skilluv_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - skilluv-net

  # Uptime Kuma — self-host uptime monitor + status page (Phase 1.4)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: skilluv-uptime-kuma
    ports:
      - "${UPTIME_KUMA_PORT:-3010}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    networks:
      - skilluv-net

volumes:
  skilluv_pgdata:
  skilluv_redisdata:
  skilluv_miniodata:
  uptime_kuma_data:

networks:
  skilluv-net:
    driver: bridge
