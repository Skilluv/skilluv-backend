# The Discord server Skilluv wants, declared once.
#
# ## Why a file and not the backlogs
#
# The channel lists come from `skilluv-strategy/pm-backlog-md/*/O-onboarding.md`
# and `docs/*/DISCORD-STRUCTURE.md`. Those are prose written for people, and a
# tool that parsed them to decide what to create on a live server would break
# the first time somebody reworded a bullet. They were read once, by hand, into
# this file. This file is the statement of record now; the backlogs explain it.
#
# ## What reads it
#
# `scripts/discord-setup.py`. It compares this to the actual server and creates
# what is missing. Nothing here is applied without `--create`.
#
# ## `purpose`
#
# The five values `services::discord_announce::Purpose` routes on: general,
# contests, winners, missions, promotions. A channel carrying one becomes a row
# in `discord_channels`, so `contest_opened` in the design domain lands in
# #design-concours. A channel without one is a room for people, not a
# destination for the platform.
#
# ## `grants_on`
#
# What a role means on the platform. docs/design/DISCORD-STRUCTURE.md sets the
# rule: a Discord role matching nothing on the platform is an authority that
# does not exist. A role with `grants_on` can one day be granted by a
# reconciliation loop; `manual = true` marks the ones that are yours to hand
# out. That loop does not exist yet, and cannot until something fills
# `users.discord_user_id` -- see the report the script prints.

# -- The rooms that belong to nobody in particular ------------------

[[categories]]
name = "ACCUEIL"
domain = ""
channels = [
    { name = "annonces", purpose = "general" },
    { name = "promotions", purpose = "promotions" },
    { name = "presentations" },
    { name = "aide" },
]


