[package]
name = "skilluv-backend"
version = "0.1.0"
edition = "2024"
description = "Skilluv — Plateforme gamifiée de démonstration de compétences"
license = "AGPL-3.0-or-later"
default-run = "skilluv-backend"

# cargo-machete false-positive ignores. Each entry has a written reason —
# do NOT add to this list without checking that the crate is actually
# unused. To verify: `cargo tree -p <crate>` shows the transitive path.
[package.metadata.cargo-machete]
ignored = [
    # Diamond dep : p256 0.13 re-exports elliptic-curve 0.13 while our
    # openidconnect 4.x direct dep uses elliptic-curve 0.14. We import
    # ToEncodedPoint via p256::elliptic_curve::sec1 (BE-P1-CONTRACT
    # push_sender.rs) so machete can't see the direct usage.
    "elliptic-curve",
    # Build-only crates (tonic codegen + protobuf compiler). Referenced
    # only in build.rs — cargo-machete's source scanner doesn't traverse
    # build scripts.
    "protox",
    "tonic-build",
    "tonic-prost-build",
    # utoipa-axum : router integration for OpenAPI wiring. Currently
    # unused (we use utoipa's manual attach in src/openapi.rs) but kept
    # for future migration to the auto-router pattern.
    "utoipa-axum",
]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["timeout", "limit"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "bigdecimal"] }
bigdecimal = { version = "0.4", features = ["serde"] }
num-traits = "0.2"

# Multi-PSP abstraction (Phase 4)
async-trait = "0.1"

# Redis
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }

# Auth
argon2 = "0.5"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
base32 = "0.5"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"

# HTTP client (Judge0)
reqwest = { version = "0.13", features = ["json", "form"] }

# SMTP transport (used for local dev via Mailpit; production still uses Brevo HTTP API)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }

# WebAuthn / passkeys — relies on system OpenSSL (see .cargo/config.toml on Windows).
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
url = "2"


# HMAC for webhook signatures
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
getrandom = "0.4"
rand_core = "0.6"

# S3/MinIO storage
rust-s3 = { version = "0.37", features = ["tokio-rustls-tls"], default-features = false }

# Monitoring
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# gRPC (tonic 0.14 split: runtime split into tonic + tonic-prost) (tonic 0.14 split: runtime split into tonic + tonic-prost)
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"

# WebSocket
futures-util = "0.3"

# CLI for auxiliary binaries (backup, etc.)
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Error tracking (Sentry-compatible; works with self-hosted GlitchTip)
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tower = { version = "0.48", features = ["http"] }
sentry-tracing = "0.49"

# ZIP for GDPR data export
zip = { version = "2", default-features = false, features = ["deflate"] }

# i18n (FR/EN bundled)
rust-i18n = "4"

# Authenticated encryption for at-rest secrets (GitHub OAuth tokens, etc.)
chacha20poly1305 = "0.11"

# Web push VAPID natif (pure Rust, sans OpenSSL) — RFC 8291 + 8292
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"] }
aes-gcm = "0.11"
hkdf = "0.13"

# OIDC B2B SSO (enterprise) — discovery, PKCE, JWKS rotation, ID token verify.
openidconnect = "4"
elliptic-curve = { version = "0.14", features = ["sec1"] }

# OpenAPI generation + contract testing (BE-P1-CONTRACT).
# utoipa builds a rustc-verified OpenAPI 3.1 schema from #[utoipa::path]
# annotations. utoipa-swagger-ui serves the interactive docs UI. The generated
# openapi.json feeds schemathesis in CI for property-based contract fuzzing.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
utoipa-axum = "0.2"

[[bin]]
name = "skilluv-backend"
path = "src/main.rs"

[[bin]]
name = "skilluv-backup"
path = "src/bin/backup.rs"

[[bin]]
name = "skilluv-seed"
path = "src/bin/seed.rs"

[[bin]]
name = "skilluv-seed-admin"
path = "src/bin/seed_admin.rs"

[[bin]]
name = "skilluv-github-ingest"
path = "src/bin/github_ingest.rs"

[build-dependencies]
tonic-build = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "cookies", "form"] }
tokio = { version = "1", features = ["full"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
# Mock OIDC IdP for enterprise SSO integration tests.
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.10"
