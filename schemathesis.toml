# Contract-fuzzing configuration.
#
# Picked up automatically by `schemathesis run` from the repository root. The
# workflow (.github/workflows/contract-test.yml) passes `--checks all`; what is
# here narrows that for the operations where a check asks for something the
# API should not do.
#
# Every exclusion needs a written reason. The rule is the same one deny.toml
# follows for advisories: an exception that nobody can explain later becomes an
# exception nobody dares remove.

[generation]
# Do not generate NUL inside strings.
#
# JSON Schema's `string` admits `\0`; a PostgreSQL `text` column does not, at
# all. So the API refuses a request carrying one, with a 400 saying so — which
# is the correct answer and which the generic "schema-compliant input must be
# accepted" check reads as a bug.
#
# Turned off here rather than by disabling that check, because the check is
# worth keeping: it is the one that would notice the API refusing input it
# ought to take. What is wrong is the input, not the expectation.
allow-x00 = false

[checks.negative_data_rejection]
# 415 counts as a rejection.
#
# Schemathesis sends a POST with no body and no `Content-Type`, and axum's
# `Json` extractor answers 415 Unsupported Media Type. The check's default set
# of statuses that mean "properly rejected" is 400, 401, 403, 404, 405, 406,
# 409, 422, 428 and 5xx — 415 is not among them, so every endpoint taking a
# JSON body was reported as having accepted a schema-violating request when it
# had done the exact opposite.
#
# Widened rather than disabled, following the rule at the top of this file:
# turning the check off would end negative-data testing for the whole API to
# settle a disagreement about one status code, and it is the check that would
# notice an endpoint quietly accepting nonsense.
#
# The 415 is documented on every operation with a request body — see
# `openapi::spec()` — so a client reading the contract is not surprised by it
# either. That half was a real gap and is fixed in code; this half is the
# fuzzer's list being narrower than HTTP.
expected-statuses = ["400", "401", "403", "404", "405", "406", "409", "415", "422", "428", "5XX"]

[[operations]]
include-name = "GET /api/feed/public"

# `positive_data_acceptance` requires that anything matching the schema is
# accepted. `after` is a keyset cursor — a token the server issued — and no
# JSON Schema can say "a value I minted". The fuzzer generates a random string
# matching the pattern, the handler cannot decode it, and 400 is the right
# answer: treating an unreadable cursor as "from the beginning" makes a client
# silently re-read the whole feed and never find out why.
#
# The 400 is documented in the operation's responses, so a caller reading the
# contract knows it exists.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/talents/search"

# Same cursor, same reasoning. Here it matters more: this is a recruiter's
# tool, and a paginating client that silently restarts shows the first page
# again as though it were the third.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/cohorts"

# `offset` and `limit` are nullable integers, and for a nullable query
# parameter schemathesis sends the literal string `null`, which is not a
# number. The 400 is correct — a page offset that is not a number cannot
# be honoured — and the positive path is covered by test_t2_cohorts.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/design/slices/{id}/compare"

# `from` and `to` are `i32` round numbers; the fuzzer generates values at the
# extremes of the JSON integer range, which do not fit the column and are
# refused before any query runs. The valid path is covered by the design
# integration suite.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/design/slices/{id}/versions/{round}"

# `round` is an `i16` path segment; a value past 32767 cannot be parsed into
# it and is refused at the router. Schema-valid as a JSON integer, out of
# range for the type — the fuzzer cannot know the bound and the 400 is
# correct.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/opportunities"

# `domain`, `kind` and `orientation` are optional filters. A filter value that
# names no domain, kind or orientation is correctly refused rather than
# silently returning everything; the positive path is covered by the
# opportunities integration test.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/quality/reports"

# `target_domain` is a nullable domain filter, and the fuzzer sends the string
# `null`, which names no domain. Refusing it is correct — the alternative,
# treating an unreadable filter as no filter, hides a client bug. The
# positive path is covered by test_quality_domain.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/talent-offers"

# `offer_type` is a nullable enum filter; the fuzzer sends `null`, which is
# not one of the five kinds. The 400 is correct and the positive path is
# covered by test_t3_talent_offers_and_vouchings.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/verify/{hash}/pdf"

# Rendering a certificate needs PDF_RENDERER_URL, which is deliberately unset
# in the contract job — there is no renderer to call. The 503 is the honest,
# documented answer; neither a 2xx (positive_data_acceptance) nor a non-5xx
# (not_a_server_error) is reachable without the external service.
[operations.checks.positive_data_acceptance]
enabled = false
[operations.checks.not_a_server_error]
enabled = false

[[operations]]
include-name = "POST /maintainer-digest/subscribe"

# The fuzzer sends an empty email and a repo that is not `owner/name`. Those
# are semantic constraints — a blank address, a malformed repo — that no
# JSON Schema for a plain string expresses, and the handler is right to
# refuse them.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "POST /webhooks/linear"

# The endpoint verifies an HMAC signature the fuzzer cannot produce, and in
# the contract job LINEAR_WEBHOOK_SECRET is unset, so the honest answer is a
# 503 (now documented). Neither a signed 202 (positive_data_acceptance) nor a
# non-5xx (not_a_server_error) is reachable from a random unsigned body.
[operations.checks.positive_data_acceptance]
enabled = false
[operations.checks.not_a_server_error]
enabled = false

[[operations]]
include-name = "POST /api/stripe/webhook"

# Four webhook receivers below, same reason, and it is the CI environment
# rather than the endpoint.
#
# Each verifies a provider signature, and each acks with 200
# `acked_not_configured` when its secret is unset — deliberately, so that a
# provider does not retry forever against a deployment that cannot process
# what it sends (see the comment at src/routes/bounties.rs:615). The contract
# job leaves those secrets unset, so a bodyless POST reaches the ack branch
# and returns 200, which `negative_data_rejection` reads as the API accepting
# invalid data.
#
# In production the secret is set and the same request is refused at signature
# verification, which is the behaviour that matters and which no unsigned
# fuzzer can reach. Excluded here rather than changed: making the handler
# reject a missing body before deciding it is unconfigured would trade a real
# property — never make a provider retry — for a green check in an
# environment that does not exist anywhere else.
#
# `POST /webhooks/linear` above is the same shape, and answers 503 instead;
# the difference is that Linear has no retry storm to avoid.
[operations.checks.negative_data_rejection]
enabled = false

[[operations]]
include-name = "POST /api/webhooks/github"

[operations.checks.negative_data_rejection]
enabled = false

[[operations]]
include-name = "POST /api/webhooks/github/slices/{project_id}"

[operations.checks.negative_data_rejection]
enabled = false

[[operations]]
include-name = "POST /api/webhooks/stripe-connect"

[operations.checks.negative_data_rejection]
enabled = false

[[operations]]
include-name = "GET /api/users/{id}/timeline"

# `offset` is a nullable integer; for a nullable query parameter the fuzzer
# sends the literal string `null`, which is not a number. The 400 is correct
# and the positive path is covered by the timeline integration test.
[operations.checks.positive_data_acceptance]
enabled = false

[[operations]]
include-name = "GET /api/users/{user_id}/skill-tree"

# `domain` is a nullable domain filter; the fuzzer sends `null`, which names no
# domain. Refusing it is correct rather than silently returning the whole tree.
[operations.checks.positive_data_acceptance]
enabled = false
