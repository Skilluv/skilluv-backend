name: Nightly authorization sweep

# DA-03 — replays every OpenAPI operation as anon / normal-user / capability-
# admin against an ephemeral stack and fails on escalation, anon-admin access,
# or any 5xx. This is the regression net for the whole authorization surface:
# it regenerates from /api/openapi.json, so a newly-added domain is covered the
# next night with no extra wiring. Complements the static gate in
# check-threat-model.sh (which forbids the legacy users.role admin check at the
# source) and the authz_admin_matrix integration test (which asserts the same
# negative in-process).
#
# Builds nothing: pulls the published backend image and stands it up next to
# GitHub-service dependencies (the same postgres/redis/mailpit setup ci.yml's
# integration job uses — health-checked, no volume, so the postgres:18 data
# layout is a non-issue). Seeds only *@ci.invalid throwaway accounts; grants
# the admin capability with a psql INSERT between the register and probe phases.
# Never runs against production.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: authz-sweep-nightly
  cancel-in-progress: true

env:
  BACKEND_PORT: "3000"

jobs:
  sweep:
    name: Authorization sweep on an ephemeral stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read

    # Health-checked service containers (no volume mount → postgres:18 starts
    # clean). MinIO is NOT a service — the image needs a `server /data` command,
    # which GHA services cannot pass — so it is a docker-run step below.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: skilluv
          POSTGRES_PASSWORD: skilluv_secret
          POSTGRES_DB: skilluv
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U skilluv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.20.7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Start MinIO container
        run: |
          docker run -d --name minio -p 9004:9000 \
            -e MINIO_ROOT_USER=skilluv \
            -e MINIO_ROOT_PASSWORD=skilluv_secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the backend against the stack
        # Host network so the container reaches the service ports on localhost
        # (Postgres 5433, Redis 6379, MinIO 9004). The backend runs its own
        # migrations on startup (sqlx::migrate!); the services are already
        # health-checked by the time steps run, so Postgres is ready.
        run: |
          docker run -d --name skilluv-backend --network host \
            -e DATABASE_URL="postgres://skilluv:skilluv_secret@localhost:5433/skilluv" \
            -e REDIS_URL="redis://localhost:6379" \
            -e JWT_SECRET="authz-sweep-secret" \
            -e PORT="${BACKEND_PORT}" \
            -e BASE_URL="http://localhost:${BACKEND_PORT}" \
            -e MINIO_ENDPOINT="http://localhost:9004" \
            -e MINIO_ACCESS_KEY="skilluv" \
            -e MINIO_SECRET_KEY="skilluv_secret" \
            -e MINIO_BUCKET="avatars" \
            ghcr.io/skilluv/skilluv-backend:master

      - name: Wait for the backend to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "http://localhost:${BACKEND_PORT}/api/health" >/dev/null 2>&1; then
              echo "backend up"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"; docker logs skilluv-backend || true; exit 1

      - name: Install the harness dependency
        run: python3 -m pip install --quiet requests

      - name: Register the throwaway CI accounts
        env:
          BASE_URL: "http://localhost:${{ env.BACKEND_PORT }}"
        run: python3 scripts/pentest_authz_sweep.py register

      - name: Grant the admin capability the modern way (capability only)
        # Deliberately does NOT set users.role — that is the whole point: the
        # positive control must exercise a capability-provisioned admin, the
        # path admin_grant_capability actually uses. psql runs from a throwaway
        # postgres image over the host network (the service container has no
        # fixed name to `docker exec`).
        run: |
          docker run --rm --network host -e PGPASSWORD=skilluv_secret \
            postgres:18.4-alpine \
            psql -h localhost -p 5433 -U skilluv -d skilluv -v ON_ERROR_STOP=1 -c "
              INSERT INTO user_capabilities (user_id, capability, granted_reason)
              SELECT u.id, 'admin', 'ci_authz_sweep'
              FROM users u
              WHERE u.email = 'authz_admin@ci.invalid'
                AND NOT EXISTS (
                  SELECT 1 FROM user_capabilities c
                  WHERE c.user_id = u.id AND c.capability = 'admin' AND c.revoked_at IS NULL
                );"

      - name: Sweep (fails the job on escalation / anon-admin / 5xx)
        env:
          BASE_URL: "http://localhost:${{ env.BACKEND_PORT }}"
        run: python3 scripts/pentest_authz_sweep.py probe

      - name: Tear down
        if: always()
        run: |
          docker rm -f skilluv-backend minio || true
