name: Mutation (PR, incremental)

# CI-02's mutation gate, incremental. cargo-mutants --in-diff mutates only the
# lines this PR changed, so it answers one question fast: do the new/changed
# tests actually catch a bug introduced into the new/changed code? A surviving
# mutant means a line was added with coverage but no real assertion.
#
# ADVISORY by design. It is a separate workflow, not a job in ci.yml, so it can
# never block a merge unless someone deliberately adds "Mutation (PR)" to branch
# protection — and it declares its own unique job name, so it does not trip the
# required-check-uniqueness guard. It only runs when one of the ten critical
# modules (see .cargo/mutants.toml) is touched.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/services/security_findings.rs"
      - "src/services/missions.rs"
      - "src/services/ranks.rs"
      - "src/services/capabilities_engine.rs"
      - "src/services/badge_engine.rs"
      - "src/services/cvss.rs"
      - "src/services/proof_hooks.rs"
      - "src/services/attestations.rs"
      - "src/routes/talent_search_v4.rs"
      - "src/routes/payments.rs"

permissions:
  contents: read

concurrency:
  group: mutants-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: Mutation (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0   # need the base to compute the diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Install cargo-mutants + nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Build the PR diff against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff "${BASE_SHA}" HEAD > pr.diff

      - name: Mutation-test the changed lines
        # --in-diff restricts mutation to the diff; .cargo/mutants.toml then
        # intersects that with the ten critical modules. A survivor fails the
        # job (advisory until added to branch protection).
        run: cargo mutants --in-diff pr.diff --test-tool nextest -j 2
