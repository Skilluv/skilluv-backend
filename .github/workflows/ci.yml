name: CI

on:
  # No path filter. A workflow-level `paths-ignore` here is exactly what CI-01
  # fixed: branch protection requires `Build & Lint` and `Integration Tests`
  # by name, and a workflow skipped by a path filter never reports them, so a
  # docs-only pull request either waits forever (paths-ignore too broad) or a
  # second stub workflow has to answer for it (paths in one file, paths-ignore
  # in the other) — and those two filters are NOT complements for a pull
  # request touching Markdown *and* Rust: both fire, two jobs claim the same
  # required name, and the trivial one can green a real change.
  #
  # So this workflow always runs, and the `changes` job below decides whether
  # the expensive Rust jobs do any work. The required checks always report:
  # `Build & Lint` skips cleanly on a docs-only change, `Integration Tests`
  # always runs and reports green unless a real shard failed.
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel any in-progress run on the same branch when a new commit arrives.
# Saves ~30 min of GHA time per force-push during PR iteration.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # NB : SCCACHE_GHA_ENABLED + RUSTC_WRAPPER are scoped to the `check` job
  # only (see its own env block). At workflow level, RUSTC_WRAPPER=sccache
  # crashes jobs that don't install the sccache binary (audit, secrets).

# Least-privilege default. Jobs that need more (publish → packages:write,
# check → actions:write for sccache) override in their own `permissions:` block.
permissions:
  contents: read

jobs:
  # ─── Change detection ──────────────────────────────────────────────
  # One cheap job (~30s, no build) that answers a single question: does this
  # ref touch anything other than documentation? Every expensive job below
  # gates on its `code` output. This replaces the old workflow-level
  # `paths-ignore` + a second stub workflow (CI-01) with one honest signal.
  #
  # A changed file counts as code unless it matches one of the documentation
  # patterns (see scripts/detect-code-changes.sh). So a pull request that
  # touches a README *and* a .rs file yields code=true (the .rs file is not a
  # doc) — the exact mixed case the two-workflow design got wrong. When the
  # diff range can't be resolved, the script fails safe to code=true.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # Full history so the diff endpoints (PR base.sha, push before-sha)
          # are reachable. No third-party action: the classification is a few
          # lines of git in scripts/detect-code-changes.sh, testable locally,
          # in the spirit of the gitleaks-CLI-over-action choice elsewhere.
          fetch-depth: 0
      - name: Classify the diff — code vs documentation only
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/detect-code-changes.sh

  # ─── Static gates ──────────────────────────────────────────────────
  # Cheap, fail-fast : lint, secret leaks, known CVEs. All three run in
  # parallel and gate the heavier test job.

  check:
    name: Build & Lint
    # Required check. On a docs-only change this skips cleanly — a skipped
    # required job is reported to branch protection as success, so the check
    # is satisfied without compiling a line of Rust.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 25 min budget : cold cache full cargo build (release) + clippy + fmt
    # is 12-18 min. sccache accelerates subsequent runs but the FIRST run
    # after a Cargo.lock change is cold.
    # Raised from 25 with `--features discord-bot`: the job now compiles
    # serenity and the bot binary too, which the Docker image job does in
    # about sixteen minutes from cold.
    timeout-minutes: 40
    permissions:
      contents: read
      # sccache-action needs the GHA cache API (mozilla-actions/sccache-action).
      actions: write
    env:
      # sccache is installed in this job only — RUSTC_WRAPPER is job-scoped
      # so cargo commands in other jobs don't try to invoke a non-existent binary.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          components: clippy, rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Cache cargo registry & git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          # `target/` deliberately EXCLUDED : it grew to ~9 GB after we
          # added sqlx offline data + utoipa spec generation, and the
          # save/restore round-trip alone was blowing the job timeout
          # (7 min download + 4+ min upload out of a 25 min budget).
          # sccache handles compile-unit caching for us via the GHA
          # cache API — no need to also snapshot target/. Registry + git
          # dirs stay cached to avoid re-downloading crates.io deps.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Check formatting
        run: cargo fmt --all -- --check

      # `--features discord-bot` because without it this job does not compile
      # the Discord bot at all, and neither does the test job. The only thing
      # that built `src/bin/discord_bot.rs` was the Docker image job, sixteen
      # minutes downstream -- so a broken bot passed fmt, build, clippy and
      # eight test shards before anything noticed.
      #
      # The feature is what the shipped image uses (`Dockerfile`, `cargo build
      # --release --features discord-bot`), so building it here is building
      # what we deploy rather than a subset of it.
      - name: Build
        run: cargo build --release --features discord-bot

      - name: Clippy lint
        run: cargo clippy --features discord-bot -- -D warnings -A dead_code -A unused_imports

      # The bot's own unit tests. `cargo nextest run` in the test job carries
      # no features, so `#[cfg(test)] mod tests` in the bot has never compiled
      # there and never run -- including
      # `every_command_description_fits_discord`, which exists *because* one
      # over-long description made Discord refuse the whole command tree and
      # left the bot serving three subcommands out of nine. A guard against a
      # failure that already happened, that had never executed once.
      #
      # Run here rather than in the shards: the feature changes the cfg, so
      # adding it there would recompile the library in all eight.
      - name: Discord bot unit tests
        run: cargo test --features discord-bot --bin skilluv-discord-bot

      - name: Install cargo-machete
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2
        with:
          tool: cargo-machete

      - name: Detect unused dependencies
        # cargo-machete reports crates declared in Cargo.toml but never used
        # in the source. Prevents dep-graph bloat. `--with-metadata` cross-
        # references features flags to reduce false positives.
        run: cargo machete --with-metadata

  audit:
    name: Cargo Audit + Deny (CVE, licenses, banned crates)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: Install cargo-deny
        # cargo-deny supersets cargo-audit : same RustSec advisory DB PLUS
        # license compliance PLUS banned/duplicate crate detection. Config
        # in `deny.toml` at repo root.
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2
        with:
          tool: cargo-deny
      - name: Run cargo deny
        run: cargo deny check advisories licenses bans sources

  secrets:
    name: Secret Scan (gitleaks)
    # Deliberately NOT gated on `changes.outputs.code`: a secret pasted into a
    # README or a docs page is still a leaked secret. Cheap enough (~5 min) to
    # run on every change, documentation included. Do not add a code-only gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          # Full history so gitleaks scans every commit, not just HEAD.
          fetch-depth: 0
      # gitleaks-action@v2 requires a paid license for GitHub Organizations
      # (breaking change, cf. https://github.com/gitleaks/gitleaks-action#-announcement).
      # Fallback to the CLI download — free, same detection, no license needed.
      # We keep .gitleaks.toml as the allowlist config (auto-picked from repo root).
      - name: Install gitleaks CLI
        run: |
          VERSION=8.21.2
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  migrations:
    # Applies every migration to an empty database, in order, then asserts the
    # invariants the schema is supposed to hold.
    #
    # It exists because the integration suite is the wrong instrument for this.
    # A migration that fails leaves all eight shards red with the same
    # unrelated error, forty-five minutes later; this says which migration and
    # which line in about two. Every vocabulary this repo has lost -- six
    # CHECK-to-table conversions that each dropped another branch's values,
    # and one capability a route guarded itself with that no row could grant --
    # was found by a foreign key violation in CI rather than here, which is
    # what this job changes.
    name: Migrations Apply And The Schema Holds
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft == false
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: skilluv
          POSTGRES_PASSWORD: skilluv_secret
          POSTGRES_DB: skilluv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skilluv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
      - name: Install sqlx-cli
        # Prebuilt rather than `cargo install`, which is a four-minute compile
        # for a job whose whole point is to answer faster than the suite does.
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2
        with:
          tool: sqlx-cli
      - name: Apply migrations and check invariants
        env:
          DATABASE_BASE_URL: postgres://skilluv:skilluv_secret@127.0.0.1:5432
          PGPASSWORD: skilluv_secret
        run: bash scripts/check-migrations.sh

  test:
    # Matrix sharding — nextest partitions tests by hash across N runners.
    # Each shard is a fresh job with its own Postgres/Redis/MinIO, so there
    # are no shared-state collisions.
    #
    # 2 → 4 → 8. The move to 8 was not about speed for its own sake: at 4,
    # three shards out of four were being killed by the timeout, so a run
    # reported one shard's failures out of four and the rest of the
    # information was simply lost. Debugging on a quarter of the evidence is
    # what made the last few rounds slow.
    #
    # What sharding actually buys, measured on the 4-shard runs: a shard is
    # ~12 min of checkout, services and compilation, plus ~16 min of tests.
    # Only the second half divides — `cargo nextest --partition` compiles the
    # whole suite in every shard and then runs a slice of it. So 8 shards is
    # ~12 + ~8 = ~20 min, not half of 28. Past this the fixed compile cost
    # dominates and more runners buy almost nothing; the next real win is
    # compile time, not more parallelism.
    #
    # It finds no additional failures. The same suite runs either way — what
    # changes is that its results survive to be read.
    #
    # fail-fast: false ensures we see all shard failures at once instead of
    # the first one aborting the rest — critical for debugging.
    name: Integration Tests (shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # `migrations` too: a chain that does not apply makes all eight shards red
    # with the same unrelated error, which is eight runners spent to learn one
    # thing that job already said.
    needs: [changes, check, audit, secrets, migrations]
    # Skip drafts to save quota — devs can mark PR ready when they want CI.
    # Also skip on a docs-only change (code=false): the aggregator below still
    # reports the required "Integration Tests" check green in that case.
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft == false
    # A timeout should catch a hang, not a slow week — which means it has to
    # be sized for what the job actually does, and shard 1 does more than the
    # rest. It runs the doctests, and it is the single writer for the shared
    # build cache, so on a cache miss it pays an upload the other seven skip.
    #
    # Measured on the master run right after the eight-branch merge, where the
    # Cargo.lock change guaranteed a miss:
    #
    #   setup, services, toolchain    ~4 min
    #   tests (cold, full compile)    ~33 min
    #   doctests                      ~20 s
    #   save cargo + target cache     ~16 min      <- shard 1 only
    #                                 -------
    #                                 ~53 min
    #
    # Every step succeeded and the cache was written; the job was killed at 45
    # anyway, and the aggregate reported the run as failed. That is the exact
    # failure this comment was written to prevent, one layer down: a budget set
    # from the average job rather than from the job it applies to.
    #
    # So shard 1 gets the room its extra work needs and the rest keep 45. A
    # single number for jobs doing different work is how one of them silently
    # runs out of it.
    # Raised from 75/45. Seven shards finished inside forty-five and the eighth
    # was cancelled at it — a suite that grows a few tests per branch will keep
    # brushing a limit set that close, and a cancellation reads as a failure
    # nobody can diagnose from the log, because the log stops mid-run.
    timeout-minutes: ${{ matrix.shard == 1 && 90 || 60 }}
    permissions:
      contents: read
      # sccache-action needs the GHA cache API (mozilla-actions/sccache-action).
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: skilluv
          POSTGRES_PASSWORD: skilluv_secret
          POSTGRES_DB: skilluv
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U skilluv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Mailpit — SMTP dev catcher. Le test harness force SMTP_HOST=localhost:1025
      # (voir tests/common/mod.rs::spawn). Sans ce service, /api/auth/register et
      # /api/enterprise/register renvoient 500 sur echec SMTP.
      mailpit:
        image: axllent/mailpit:v1.20.7
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -q --spider http://localhost:8025 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MinIO n'est PAS declare comme service GHA : les services ne supportent
      # pas de champ `command`, et l'image minio/minio requiert `server /data`
      # en argument (sans ca, elle affiche l'usage et sort). On la lance en step
      # (voir "Start MinIO container" plus bas).

    env:
      # sccache installed via sccache-action below (matches check job pattern).
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      DATABASE_URL: postgres://skilluv:skilluv_secret@localhost:5433/skilluv
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      BASE_URL: http://localhost:3001
      JUDGE0_URL: http://localhost:2358
      MINIO_ENDPOINT: http://localhost:9004
      MINIO_ACCESS_KEY: skilluv
      MINIO_SECRET_KEY: skilluv_secret
      MINIO_BUCKET: avatars
      # Backend tracing is invisible in tests without a subscriber (see
      # tests/common/mod.rs::init_test_tracing). Verbose here to surface any
      # 500 root causes in the CI logs.
      RUST_LOG: info,skilluv_backend=debug,sqlx=warn
      # Link with lld rather than GNU ld.
      #
      # Every one of the eight shards died at
      # `collect2: fatal error: ld terminated with signal 7 [Bus error]`, with
      # 107 GB of disk free — so this was never the disk the comment below
      # talks about. It is memory: the runner has 16 GB and GNU ld holds the
      # whole of each of these binaries in it, several at a time.
      #
      # lld uses a fraction of that and links several times faster. Nothing
      # about the produced binary changes for a test run.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      # `CARGO_BUILD_JOBS: "2"` stood here and has been removed.
      #
      # It was aimed at a memory theory, and the logs disproved it: the shard
      # that died printed `zstd: No space left on device` before the linker's
      # SIGBUS. The disk was the cause, `CARGO_PROFILE_TEST_DEBUG=0` and the
      # wider reclaim below are the fix, and halving the build only bought a
      # shard that ran past its forty-five minutes and was cancelled.
      #
      # Keeping a slowdown that fixed nothing would have made every run pay for
      # a wrong guess.
      # No debug info in CI artifacts.
      #
      # `zstd: No space left on device` and
      # `ld terminated with signal 7 [Bus error]` in the same log are one
      # failure, not two: the disk fills, and a linker writing through a
      # memory-mapped file that can no longer grow gets SIGBUS rather than
      # ENOSPC. `[profile.test] debug = "line-tables-only"` in Cargo.toml is
      # already a reduction; forty-six test binaries make even that too much.
      #
      # The cost is line numbers in CI panic messages. Worth paying: the file
      # and the assertion still print, and a suite that cannot run tells you
      # nothing at all. Local runs keep their line numbers.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      # A runner ships with ~25 GB of SDKs this repository never touches, and
      # linking 46 test binaries per shard needs the space more than they do.
      # Without this the shards die mid-link — ENOSPC on three of them and a
      # linker SIGBUS on the fourth, which is the same disk with a different
      # error message. `[profile.test] debug = "line-tables-only"` in
      # Cargo.toml is the other half; either alone leaves no margin.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/lib/node_modules /usr/share/swift \
                      /usr/local/.ghcup /opt/hostedtoolcache
          # The pre-pulled images are worth ~4 GB and this job starts the
          # one container it needs itself.
          docker image prune -af || true
          df -h /

      - name: Install lld
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends lld

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Start MinIO container
        run: |
          docker run -d --name minio \
            -p 9004:9000 \
            -e MINIO_ROOT_USER=skilluv \
            -e MINIO_ROOT_PASSWORD=skilluv_secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data

      - name: Wait for MinIO to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9004/minio/health/live > /dev/null 2>&1; then
              echo "MinIO ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become ready after 30s"
          docker logs minio
          exit 1

      # GeoNames data files are gitignored (~31MB total) but required by
      # `GeoService::load` which several integration tests instantiate. Download
      # them once here, cache across runs.
      - name: Cache GeoNames data
        id: cache-geonames
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: data
          key: geonames-cities1000-countryinfo-v1

      - name: Download GeoNames data
        if: steps.cache-geonames.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          curl -fsSL https://download.geonames.org/export/dump/cities1000.zip -o /tmp/cities1000.zip
          unzip -o /tmp/cities1000.zip -d data
          curl -fsSL https://download.geonames.org/export/dump/countryInfo.txt -o data/countryInfo.txt
          ls -lh data/

      # Restore on every shard, save from shard 1 only.
      #
      # The four shards share one cache key, so on a cold key all four try
      # to upload the same ~9 GB `target/` at once. Only one upload can win;
      # the others compress and transfer for minutes before losing the race.
      # That is what cancelled shard 2 on 1d12b2e8 — its tests had already
      # passed, and the job hit its budget inside the cache save.
      #
      # Cache entries are branch-scoped, so the first run on master after a
      # merge always starts from a partial restore no matter how warm the
      # pull request was. This is therefore a merge-day failure, not a rare
      # one.
      #
      # `target/` stays in the cache here, unlike the check job, which
      # dropped it (see its own comment). That job builds one binary; this
      # one links ~65 test binaries, and sccache caches compile units but
      # not linking, so dropping `target/` would trade upload time for link
      # time on every shard.
      - name: Restore cargo registry & build cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518  # v2
        with:
          tool: cargo-nextest

      - name: Run integration tests (shard ${{ matrix.shard }}/8)
        # `--partition count:N/8` — nextest hash-partitions the suite
        # across 8 shards. `--test-threads=1` kept within each shard
        # because a few tests still touch shared Postgres server-side
        # state (RLS GUC, metrics counters).
        #
        # `--no-fail-fast` because the default stops a shard at its first
        # failure: a branch with six broken tests reports four, and each
        # fix costs another twenty-five minute run to see the next one.
        # The shards run in parallel anyway, so finishing them costs
        # nothing over stopping early.
        run: |
          cargo nextest run \
            --test-threads=1 \
            --no-fail-fast \
            --partition count:${{ matrix.shard }}/8 \
            --failure-output=immediate \
            --success-output=never

      - name: Run doctests (shard 1 only)
        # Doctests are cheap and not sharded ; run them once on shard 1 to
        # avoid duplicating the same run across 4 jobs.
        if: matrix.shard == 1
        run: cargo test --doc

      # One writer for the shared key. Runs even when the tests fail —
      # a populated `target/` is worth caching either way, and paying the
      # upload only to discard it on red would make every failing run
      # slower for nothing.
      - name: Save cargo registry & build cache
        if: always() && matrix.shard == 1 && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Cleanup MinIO container
        if: always()
        run: docker rm -f minio || true

  integration-tests:
    # Umbrella status check for the sharded `test` matrix. Branch
    # protection requires a check literally named "Integration Tests";
    # each shard reports as "Integration Tests (shard N/8)", so this
    # aggregator fans them in under the required name. Runs even on
    # shard failure so protection sees a red "Integration Tests"
    # instead of a pending one.
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, test]
    # always() so this required check always reports a conclusion — never
    # pending. On a docs-only change the `test` matrix is skipped and this
    # greens (nothing to run); on a code change it mirrors the matrix result.
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: Fail if a real shard failed or was cancelled
        # Only meaningful when code changed. On docs-only, needs.test.result
        # is 'skipped' and this step is itself skipped, so the job stays green.
        if: needs.changes.outputs.code == 'true' && needs.test.result != 'success'
        run: |
          echo "test matrix result: ${{ needs.test.result }}"
          exit 1
      - name: Docs-only change — no Rust to test
        if: needs.changes.outputs.code != 'true'
        run: |
          echo "Documentation-only change. The suite would run the same code already green on master."
      - name: All shards passed
        if: needs.changes.outputs.code == 'true' && needs.test.result == 'success'
        run: echo "All 8 test shards succeeded."

  publish:
    # Build + push a Docker image to GHCR on every master push so downstream
    # consumers (skilluv-admin CI e2e job) can pull a ready-to-run backend
    # without rebuilding Rust in each PR. Master is protected + PR-merge only,
    # so `:master` is always a green build. `:master-<sha>` gives traceability.
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/skilluv/skilluv-backend:master
            ghcr.io/skilluv/skilluv-backend:master-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        # Skips silently if the required secrets are unset — lets the workflow
        # keep working in forks / rewinds without hard-failing on missing config.
        # Coolify's /api/v1/deploy endpoint requires a Bearer token; the UUID
        # in the URL only identifies which app to redeploy.
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_WEBHOOK_URL or COOLIFY_TOKEN unset — skipping deploy trigger."
            exit 0
          fi
          # -w prints HTTP status + response body on both success and failure so
          # any future Coolify API mismatch is diagnosable from CI logs directly,
          # instead of guessing across multiple PRs (cf. #52/#53/#54 iteration).
          response=$(curl --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "$COOLIFY_WEBHOOK_URL")
          echo "$response"
          status=$(echo "$response" | grep -oE "HTTP_STATUS:[0-9]+" | cut -d: -f2)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify webhook returned HTTP $status"
            exit 1
          fi

      - name: Wait for deploy + smoke test
        # SKI-28 (Hygiène pré-prod HYG-01) — after Coolify triggers a
        # redeploy, wait a bit for the new container to boot then hit
        # scripts/smoke.sh against the live URL. Fails the workflow if
        # the new deploy is silently broken.
        # Skips when SKILLUV_SMOKE_URL is unset (e.g. fork PRs).
        env:
          SKILLUV_SMOKE_URL: ${{ secrets.SKILLUV_SMOKE_URL }}
        if: env.SKILLUV_SMOKE_URL != ''
        run: |
          echo "Waiting 60s for Coolify to swap the image..."
          sleep 60
          chmod +x scripts/smoke.sh
          bash scripts/smoke.sh "$SKILLUV_SMOKE_URL"

      - name: Notify Discord on failure
        # SKI-32 (Hygiène pré-prod HYG-05) — post the failure to Discord
        # #ops-alerts channel via webhook. Fires on any prior step failing
        # in this job (Docker publish, Coolify webhook, or smoke test).
        # Skips silently when DISCORD_ALERT_WEBHOOK_URL is unset.
        if: failure() && env.DISCORD_ALERT_WEBHOOK_URL != ''
        env:
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          # Build JSON payload with jq to avoid shell interpolation of
          # attacker-controllable context values (github.actor). zizmor E2.
          payload=$(jq -n \
            --arg sha "$COMMIT_SHA" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            '{content: ("**CI publish/deploy failed on master** — commit `" + $sha + "` by " + $actor + "\n" + $url)}')
          curl --silent --show-error --max-time 15 \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_ALERT_WEBHOOK_URL" || echo "Discord notify failed — not blocking"
